version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campusflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow_password
      POSTGRES_DB: campusflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusflow_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://campusflow:campusflow_password@db:5432/campusflow
      SECRET_KEY: change-me-in-production-random-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      FRONTEND_ORIGIN: http://localhost:3000,http://localhost:5173,http://localhost
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/integrations/gmail/callback}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: campusflow_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
